body:not(.ingame)::before{background:radial-gradient(ellipse 85% 75% at 50% 26%,#16307c 0%,#0b1742 46%,#05060f 100%)}
#home{position:relative;overflow:hidden}
.hsky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#home .hbox{position:relative;z-index:1}
#home .nsub{color:#cfdaff;letter-spacing:.16em;font-size:14px;margin-bottom:12px;text-align:center}
#home .nsub::after{content:"";display:block;width:132px;height:4px;margin:12px auto 0;border-radius:3px;background:linear-gradient(90deg,#ec4d6e 0 25%,#f39a2b 25% 50%,#22a06b 50% 75%,#3b62d8 75%)}
#home .ni{background:#fff;color:#16203f;border:2px solid #fff;border-radius:14px;padding:14px 16px;font-size:17px;box-shadow:0 6px 18px #0007;transition:border-color .15s,box-shadow .15s}
#home .ni::placeholder{color:#9aa3bd;opacity:1}
#home .ni:focus{border-color:#00d9f5;box-shadow:0 0 0 4px #00e5ff40,0 6px 18px #0007}
#home .nb{border:0;text-shadow:none;letter-spacing:.08em;font-size:18px;font-weight:900;border-radius:14px;box-shadow:0 5px 0 #00000066,0 10px 22px #0006;transition:transform .08s,box-shadow .08s,filter .15s}
#home .nb.cy{background:linear-gradient(#45f1ff,#00cde6);color:#05233a}
#home .nb.mg{background:linear-gradient(#ffe36b,#ffc72a);color:#3d2700}
#home .nb:hover{filter:brightness(1.07);background-color:transparent}
#home .nb.cy:hover{background:linear-gradient(#45f1ff,#00cde6);color:#05233a}#home .nb.mg:hover{background:linear-gradient(#ffe36b,#ffc72a);color:#3d2700}

#home .or{color:#a9b8ec;letter-spacing:.3em}
#home button.g{background:#ffffff12;border:1px solid #ffffff33;color:#eef3ff;border-radius:12px;box-shadow:none}
#home button.g:hover{background:#ffffff22;border-color:#ffffff66}
#home .bgm{background:#ffffff0c;border-color:#ffffff22}
#home .mode{color:#93a2d4}
#home .bgmw{text-wrap:balance;max-width:400px;margin-left:auto;margin-right:auto}

#tkl .tok{margin:0;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--pc) 52%,#fff) 0,var(--pc) 50%,color-mix(in srgb,var(--pc) 70%,#000) 100%);box-shadow:0 0 0 2.5px #fff,0 0 0 3.6px #0b1638,0 3px 7px #000b}

1:["병원비 지불","병원에서 건강진단을 받았습니다. 병원비 5만원을 은행에 납부합니다.","병원 → HOSPITAL(호스피탈)"],
2:["복권 당첨","축하합니다. 복권에 당첨되었습니다. 당첨금 20만원을 은행에서 받습니다.","축하 → CONGRATULATION(콩그레츄레이션)"],
3:["무인도 탈출","특수 무전기. 무인도에 갇혀 있을 때 사용할 수 있습니다. 1회 사용 후 반납합니다. (20만원에 팔 수 있음)","사용하다 → USE(유스)"],
4:["무인도","폭풍을 만났습니다. 무인도로 곧장 가세요. 출발지를 지나더라도 월급을 받을 수 없습니다.","폭풍 → STORM(스톰)"],
5:["파티 초대권","대중 앞에서 장기자랑을 하세요. 다른 게임 참가자들이 정한 상금을 은행에서 지불합니다.","자랑 또는 전시 → SHOW(쇼)"],
6:["관광 여행","제주도로 가세요. 제주도 소유주에게 통행료를 지불합니다. 출발지를 지나갈 경우 월급을 받습니다.","섬 → ISLAND(아일랜드)"],
7:["과속운전 벌금","과속운전을 하였습니다. 범칙금 5만원을 은행에 납부합니다.","운전 → DRIVE(드라이브)"],
8:["해외 유학","학교 등록금을 내세요. 등록금 10만원을 은행에 납부합니다.","학교 → SCHOOL(스쿨)"],
9:["연금 혜택","노후연금을 받으세요. 연금 5만원을 은행에서 받습니다.","은행 → BANK(뱅크)"],
10:["이사","뒤로 세 칸 옮기세요.","옮기다 → MOVE(무브)"],
11:["고속도로","출발지까지 곧바로 가세요. 출발지에서 월급을 받습니다.","고속도로 → EXPRESSWAY(익스프레스 웨이)"],
12:["우승","자동차 경주에서 챔피언이 되었습니다. 상금 10만원을 은행에서 받습니다.","우승자 → CHAMPION(챔피언) 또는 WINNER(위너)"],
13:["우대권","상대방이 소유한 장소에 통행료 없이 머무를 수 있습니다. 1회 사용 후 반납합니다. 중요한 순간에 쓰세요.","중요한 → IMPORTANT(임포턴트)"],
14:["항공여행","콩코드 여객기를 타고 '타이베이'로 가세요. 콩코드 여객기 소유주에게 탑승료를 지불합니다. 출발지를 지나갈 경우 월급을 받습니다.","여객기 → AIRPLANE(에어플레인)"],
15:["건물수리비 지불","정기적으로 건물을 수리하여야 합니다. 호텔 10만원, 빌딩 6만원, 별장 3만원 (건물별로 은행에 지불)","수리하다 → REPAIR(리페어)"],
16:["방범비","방범비를 각 건물별로 은행에 지불하세요. 호텔 5만원, 빌딩 3만원, 별장 1만원","지불하다 → PAY(페이)"],
17:["유람선 여행","퀸 엘리자베스호를 타고 '베이징'으로 가세요. 퀸 엘리자베스호 소유주에게 탑승료를 지불합니다. 출발지를 지나갈 경우 월급을 받습니다.","해양, 대양 → OCEAN(오션)"],
18:["관광 여행","부산으로 가세요. 부산을 상대방이 가지고 있을 경우 통행료를 지불합니다. 출발지를 지나갈 경우 월급을 받습니다.","관광여행 → TOUR(투어)"],
19:["생일 축하","HAPPY BIRTHDAY TO YOU! 모두에게 생일 축하를 받으세요. 전원에게 축하금 1만원씩 받습니다.","여러분 → EVERYBODY(에브리바디)"],
20:["장학금 혜택","장학금을 받으세요. 장학금 10만원을 은행에서 받습니다.","장학금 → SCHOLARSHIP(스칼러쉽)"],
21:["정기종합소득세","종합소득세를 각 건물별로 지불하세요. 호텔 15만원, 빌딩 10만원, 별장 3만원","세금 → TAX(택스)"],
22:["노벨평화상 수상","당신은 세계 평화를 위하여 공헌하였습니다. 수상금 30만원을 은행에서 받습니다.","평화 → PEACE(피스)"],
23:["관광 여행","세계 중심 도시, 서울로 가세요. 서울을 상대방이 가지고 있을 경우 통행료를 지불합니다.","대한민국 → REPUBLIC OF KOREA(리퍼블릭 오브 코리아)"],

  if(canRaise(s,pi)){p.money=fm(p.money-amt);if(to!=null)s.players[to].money=fm(s.players[to].money+amt);
    lg(s,"💸 "+p.name+" 돈 부족! "+fm(-p.money)+"만원을 마련해야 해요");ev(s,pi,"💸","돈이 <b>"+fm(-p.money)+"만원</b> 모자라요! 땅·건물을 팔거나 대출을 받아 갚아야 해요");return true;}
  if(to!=null)s.players[to].money=fm(s.players[to].money+p.money);

function fin(s){
  const al=s.players.filter(p=>!p.out);
  if(al.length<2){s.phase="end";s.winner=al[0]?al[0].name:"";lg(s,"🏆 "+s.winner+" 우승!");return;}
  const p=s.players[s.turn];
  if(s.dbl&&!p.out&&!p.jail&&!p.space){s.dbl=false;lg(s,p.name+" 더블! 한 번 더");s.phase="roll";return;}
  s.dbl=false;
  do{s.turn=(s.turn+1)%s.players.length;}while(s.players[s.turn].out);

// 앞으로 이동 (출발지를 지나면 월급)
// 가운데 알림: 한 번의 행동에서 생긴 일들을 모아 보여줌
let EVQ=[];const ev=(s,pi,ic,m)=>{EVQ.push({p:pi,ic:ic,m:m});};
function passStart(s,pi,why){const p=s.players[pi];const sal=salOf(s);gain(s,pi,sal,why||"출발점 통과 월급");ev(s,pi,"💰",(why==="세계일주 월급"?"세계일주! ":"출발점 통과! ")+"월급 <b>"+sal+"만원</b>을 받았어요");p.laps=(p.laps||0)+1;loanDue(s,pi);}
// 대출: 출발점을 지날 때마다 1바퀴, 기한이 되면 남은 대출금을 강제로 상환 (부족하면 건물 매각 → 파산)
// 대출 이자: 빌린 뒤 첫 바퀴는 면제, 2바퀴째부터 출발점을 지날 때마다 원금의 5%가 갚을 돈에 더해짐
const RATE=0.05,lp=l=>l.prin!=null?l.prin:l.amt;
const LN=p=>p.loans||[],lOwe=p=>fm(LN(p).reduce((a,l)=>a+l.amt,0)),lPrin=p=>fm(LN(p).reduce((a,l)=>a+l.prin,0));
// 대출은 빌릴 때마다 따로 계산: 각 대출마다 빌린 바퀴(st)와 상환 기한(due)이 따로 있음
function loanDue(s,pi){const p=s.players[pi];if(!LN(p).length||p.out)return;
  const keep=[];let forced=0;
  LN(p).forEach((L,j)=>{const n=p.laps-L.st;
    if(n>=2){const it=fm(L.prin*RATE);if(it>0){L.amt=fm(L.amt+it);L.int=fm((L.int||0)+it);lg(s,"🏦 "+p.name+" 대출"+(LN(p).length>1?"#"+(j+1):"")+" 이자 +"+it+"만원 (원금 "+L.prin+"만원의 5%)");}}
    const left=L.due-p.laps;
    if(left>0){if(left===1)lg(s,"⚠️ "+p.name+" 대출 "+L.amt+"만원 상환까지 1바퀴 남음");keep.push(L);}
    else forced=fm(forced+L.amt);});
  p.loans=keep;
  if(forced>0){p.rpl=p.laps;lg(s,"🏦 "+p.name+" 대출 만기! "+forced+"만원 강제 상환");ev(s,pi,"🏦","대출 만기! <b>"+forced+"만원</b>을 은행에 갚았어요");charge(s,pi,forced,null);}
}
function fwd(s,pi,dest){const p=s.players[pi];if(dest<p.pos)passStart(s,pi);p.pos=dest;}
function go(s,pi,dest){fwd(s,pi,dest);lg(s,s.players[pi].name+" → "+T[dest].n);return land(s,pi);}
function back(s,pi,n){const p=s.players[pi];p.pos=(p.pos-n+N)%N;lg(s,p.name+" 뒤로 "+n+"칸 → "+T[p.pos].n);return land(s,pi);}
function ride(s,pi,ti,dest){
  const o=s.owners[ti];
  if(o!=null&&o!==pi){const f=toll(s,ti);lg(s,s.players[pi].name+" "+T[ti].n+" 탑승료 "+f+"만원 → "+s.players[o].name);if(!charge(s,pi,f,o))return fin(s);}
  return go(s,pi,dest);
}
// 인수: 통행료를 낸 뒤 (땅값 + 지어진 건물값) × 1.2를 땅 주인에게 내고 땅과 건물을 모두 가져옴. 검정 칸은 불가
const landValue=(s,i)=>fm(T[i].p+(s.bl[i]&&!BLK.has(i)?bval(i,s.bl[i]):0));
const takePrice=(s,i)=>fm((T[i].p+(s.bl[i]?bval(i,s.bl[i]):0))*1.2);
function afterToll(s,pi,i){
  const p=s.players[pi],o=s.owners[i];
  if(!(s.opt&&s.opt.take===false)&&!p.out&&o!=null&&o!==pi&&!BLK.has(i)&&p.money>=takePrice(s,i)){s.phase="take";s.pend={i:i,t:takePrice(s,i),o:o,n:T[i].n};return;}
  fin(s);
}
function bldTax(s,pi,r){
  let sm=0;mine(s,pi).forEach(i=>{const b=s.bl[i]||[0,0,0];sm+=b[0]*r[0]+b[1]*r[1]+b[2]*r[2];});
  const p=s.players[pi];
  if(sm>0){lg(s,p.name+" 은행에 "+sm+"만원 납부");charge(s,pi,sm,null);}else lg(s,p.name+" 건물이 없어 낼 돈 없음");
}
function halfSale(s,pi){
  const p=s.players[pi],m=mine(s,pi);
  if(!m.length){lg(s,p.name+" 팔 땅이 없음");return;}
  const val=i=>T[i].p+(s.bl[i]?bval(i,s.bl[i]):0),i=m.sort((a,b)=>val(b)-val(a))[0];
  const v=fm(val(i)/2);
  p.money=fm(p.money+v);s.owners[i]=null;s.bl[i]=null;lg(s,T[i].n+" 반값 "+v+"만원에 은행 매각");
}
function card(s,pi){
  const p=s.players[pi];if(!s.deck.length){lg(s,p.name+" 🔑 황금열쇠가 남아있지 않아요");return fin(s);}
  const c=s.deck.shift();
  s.kn=(s.kn||0)+1;s.kc={c:c,by:p.name,n:s.kn};lg(s,p.name+" 🔑 #"+c+" "+KD[c][0]);
  if(KEEP.includes(c)){p.cards.push(c);lg(s,p.name+" "+KD[c][0]+" 카드 보관");return fin(s);}
  s.deck.push(c);
  if(MOVEC.includes(c)){s.phase="keygo";s.pend={c:c};return;}
  return applyCard(s,pi,c);
}
// 이동하는 황금열쇠는 뽑은 사람이 확인을 누른 뒤에 적용
const MOVEC=[4,6,10,11,14,17,18,23,25,27,28,29];
function applyCard(s,pi,c){
  const p=s.players[pi];
  switch(c){
    case 1:lg(s,p.name+" 병원비 5만원 납부");charge(s,pi,5,null);break;
    case 2:gain(s,pi,20,"복권 당첨금");break;
    case 4:p.pos=10;p.jail=3;lg(s,p.name+" 무인도로 이동 (월급 없음)");ev(s,pi,"🏝️","무인도에 도착! <b>3턴</b> 쉬거나, <b>더블</b>이 나오면 바로 탈출해요");break;
    case 5:s.phase="party";lg(s,p.name+" 장기자랑 시간! "+s.players[judge(s)].name+"님이 상금을 입력해요");return;
    case 6:return go(s,pi,5);
    case 7:lg(s,p.name+" 범칙금 5만원 납부");charge(s,pi,5,null);break;
    case 8:lg(s,p.name+" 등록금 10만원 납부");charge(s,pi,10,null);break;
    case 9:gain(s,pi,5,"연금");break;
    case 10:return back(s,pi,3);
    case 11:return go(s,pi,0);
    case 12:gain(s,pi,10,"우승 상금");break;
    case 14:return ride(s,pi,15,1);
    case 15:bldTax(s,pi,[3,6,10]);break;
    case 16:bldTax(s,pi,[1,3,5]);break;
    case 17:return ride(s,pi,28,3);
    case 18:return go(s,pi,25);
    case 19:s.players.forEach((q,k)=>{if(k!==pi&&!q.out){lg(s,q.name+" → "+p.name+" 생일 축하금 1만원");charge(s,k,1,pi);}});break;
    case 20:gain(s,pi,10,"장학금");break;
    case 21:bldTax(s,pi,[3,10,15]);break;
    case 22:gain(s,pi,30,"노벨평화상 수상금");break;
    case 23:return go(s,pi,39);
    case 24:case 30:halfSale(s,pi);break;
    case 25:fwd(s,pi,30);p.space=true;lg(s,p.name+" 🚀 무료 우주여행! 다음 차례에 원하는 칸으로 이동");break;
    case 27:{passStart(s,pi,"세계일주 월급");const f=s.fund;s.fund=0;if(f)gain(s,pi,f,"사회복지기금");break;}
    case 28:return back(s,pi,2);
    case 29:return go(s,pi,20);
  }
  fin(s);
}
// 장기자랑 상금을 정하는 사람: 현재 차례 다음 플레이어
function judge(s){let j=s.turn;do{j=(j+1)%s.players.length;}while(s.players[j].out);return j;}
// 건물: 내 땅에 도착했을 때(땅을 산 직후 포함) 보드 가운데 땅 증서에서 지음
function canBuild(s,pi,i){if(BLK.has(i)||s.owners[i]!==pi)return false;const b=s.bl[i]||[0,0,0],m=s.players[pi].money;return [0,1,2].some(k=>b[k]<[2,1,1][k]&&m>=bc(i,k));}
function land(s,pi){
  const p=s.players[pi],i=p.pos,t=T[i];
  if(p.out)return fin(s);
  if(t.t==="city"){
    const o=s.owners[i];
    if(i===SEOUL&&s.inst){lg(s,s.inst.p===pi?p.name+" 서울 분할 납부 중":"서울은 "+s.players[s.inst.p].name+"님이 분할 구매 중");}
    else if(o==null){if(p.money>=(i===SEOUL?INST[0]:t.p)){s.phase="buy";return;}lg(s,p.name+": "+t.n+" 구매 자금 부족");}
    else if(o===pi){if(canBuild(s,pi,i)){s.phase="build";s.pend={i:i,base:(s.bl[i]||[0,0,0]).slice()};return;}}
    else if(o!==pi){
      const tl=toll(s,i);
      if(tl>0){
        if(hasPass(p)){s.phase="pay";s.pend={t:tl,o:o,n:t.n,i:i};return;}
        lg(s,p.name+" → "+s.players[o].name+" 통행료 "+tl+"만원 ("+t.n+")");ev(s,pi,"💸",t.n+" 통행료 <b>"+tl+"만원</b>을 "+esc(s.players[o].name)+"님에게 냈어요");charge(s,pi,tl,o);
      }
      return afterToll(s,pi,i);
    }
  }else if(t.t==="key"){return card(s,pi);}
  else if(t.t==="island"){p.jail=3;lg(s,p.name+" 무인도 도착! (더블이 나오거나 3회 후 탈출)");ev(s,pi,"🏝️","무인도에 도착! <b>3턴</b> 쉬거나, <b>더블</b>이 나오면 바로 탈출해요");}
  else if(t.t==="fund"){const f=s.fund;s.fund=0;if(f){gain(s,pi,f,"사회복지기금");ev(s,pi,"🎁","복지기금 접수처! 모인 기금 <b>"+f+"만원</b>을 받았어요");}else{lg(s,p.name+" 접수처 도착 (받을 기금 없음)");ev(s,pi,"🎁","복지기금 접수처 도착! 아직 모인 기금이 없어요");}}
  else if(t.t==="tax"){if(charge(s,pi,15,null)){s.fund=fm(s.fund+15);lg(s,p.name+" 사회복지기금 15만원 납부");ev(s,pi,"💸","사회복지기금 <b>15만원</b>을 냈어요 (모인 기금 "+s.fund+"만원)");}}

}
// 서울 분할 납부: 구매자의 다음 두 차례 시작에 자동 납부, 돈이 모자라면 계약 취소 후 낸 돈 환불
function payInst(s,pi){
  const q=s.inst;if(!q||q.p!==pi)return;
  const p=s.players[pi],a=INST[q.n];
  if(p.money<a){const back=INST.slice(0,q.n).reduce((x,y)=>x+y,0);p.money=fm(p.money+back);s.inst=null;lg(s,p.name+" 서울 "+(q.n+1)+"회차 "+a+"만원 부족 → 분할 구매 취소, "+back+"만원 환불");return;}
  p.money=fm(p.money-a);q.n++;lg(s,p.name+" 서울 "+q.n+"회차 "+a+"만원 납부");
  if(q.n>=3){s.owners[SEOUL]=pi;s.bl[SEOUL]=null;s.inst=null;lg(s,"🎉 "+p.name+" 서울 구매 완료!");}
}
function roll(s,pi){

    if(dbl){p.jail=0;s.dbl=false;lg(s,tag+" 더블! 무인도 탈출");ev(s,pi,"🎉","더블! 무인도를 탈출했어요");}
    else{p.jail--;s.dbl=false;lg(s,tag+" 탈출 실패 (남은 기회 "+p.jail+"회)");ev(s,pi,"⛓️",p.jail?"탈출 실패! 무인도에서 <b>"+p.jail+"턴</b> 더 쉬어요":"탈출 실패! 다음 차례에는 무인도를 나가요");return fin(s);}

function pcard(s,k,me){

function renderRight(s,me){

  const live=s.phase&&s.phase!=="lobby"&&s.phase!=="end",here=live?s.players[s.turn].pos:-1;
  // preview
  let pv=PV?'':'<div class="pvph">📜<br>아래 목록에서 땅이나<br>황금열쇠를 누르면<br>여기에 크게 보여요</div>';
  if(PV&&PV.t==="d")pv+='<div class="pvc"><button class="x pvx" data-h="pvx">✕</button>'+deedHTML(s,PV.i,here)+(me>=0&&s.owners[PV.i]===me&&live&&!s.players[me].out?armBtn("sellland",PV.i,"🏦 땅 전체 매각 (+"+landValue(s,PV.i)+"만원)","g sm wide sell"):'')+'<div class="dim c2">카드를 누르면 뒤집혀요</div></div>';
  else if(PV&&PV.t==="k"){const mp=me>=0?s.players[me]:null,myT=mp&&s.turn===me&&live,held=mp&&(mp.cards||[]).includes(PV.c);let kb="";
    if(held&&PASSC.includes(PV.c))kb=myT&&s.phase==="pay"?'<button class="wide kuse" data-a="usepass">🎫 우대권 사용 (통행료 '+s.pend.t+'만원 면제)</button>':'<div class="dim c2">남의 땅 통행료를 낼 때 이 버튼으로 쓸 수 있어요</div>';
    if(held&&PV.c===ESC)kb=(myT&&s.phase==="roll"&&mp.jail>0?'<button class="wide kuse" data-a="useescape">🆘 무인도 탈출권 사용</button>':'<div class="dim c2">무인도에 갇혔을 때 쓸 수 있어요</div>')+(myT&&s.phase==="roll"?'<button class="g sm wide" data-a="sellescape">은행에 20만원에 팔기</button>':'');
    pv+='<div class="pvc"><button class="x pvx" data-h="pvx">✕</button><div class="pvk">'+keyCard(PV.c)+'</div>'+kb+'</div>';}
  $("pv").innerHTML=pv;{const rp=document.querySelector(".rp");if(rp)rp.classList.toggle("pvopen",!!PV);}
  const sig=JSON.stringify([FILT,me,s.owners,s.inst,s.players.map(p=>[p.name,p.out,p.cards]),PV,here]);
  if(sig===rsig)return;rsig=sig;
  const cnt=k=>LANDS.filter(i=>k==="bank"?s.owners[i]==null:s.owners[i]===k).length;
  const tabs=[];if(me>=0)tabs.push(["me","내 땅 "+cnt(me)]);tabs.push(["all","전체"]);tabs.push(["bank","남은 땅 "+cnt("bank")]);
  s.players.forEach((p,k)=>{if(k!==me)tabs.push([String(k),'<i style="color:'+C[k]+';font-style:normal">●</i>'+esc(p.name)]);});
  $("tb").innerHTML=tabs.map(([f,l])=>'<button data-f="'+f+'" class="'+(FILT===f?'on':'')+'">'+l+'</button>').join("");
  const want=FILT==="me"?me:FILT==="all"||FILT==="bank"?null:+FILT;
  const list=LANDS.filter(i=>FILT==="all"||(FILT==="bank"?s.owners[i]==null:s.owners[i]===want));
  $("fl").innerHTML=list.length?list.map(i=>{const t=T[i],o=s.owners[i],g=t.g==="#111"?"#3a3a40":t.g;return '<div class="fd'+(PV&&PV.t==="d"&&PV.i===i?' sel':'')+(i===here?' here':'')+'" data-pv="'+i+'" style="--g:'+g+'"><b>'+t.n+'</b><small>'+(o!=null?'<i style="background:'+C[o]+'"></i>':'')+t.p+'만'+(s.bl[i]&&bs(s.bl[i])?' '+bs(s.bl[i]):'')+'</small></div>';}).join(""):'<div class="dim">'+(FILT==="me"?"아직 가진 땅이 없어요":"해당하는 땅이 없어요")+'</div>';
  const mk=me>=0?(s.players[me].cards||[]):[];
  let kz='<div class="sec2">🔑 '+(me>=0?'내 황금열쇠':'황금열쇠')+' <small>(덱 '+(s.deck.length||30)+'장)</small></div>';
  kz+=mk.length?'<div class="kg">'+mk.map(c=>'<div data-pk="'+c+'"'+((PASSC.includes(c)&&me===s.turn&&s.phase==="pay")||(c===ESC&&me===s.turn&&s.phase==="roll"&&s.players[me].jail>0)?' class="usable"':'')+'>'+keyCard(c,"sm")+'</div>').join("")+'</div>':'<div class="dim">'+(me>=0?'보관 중인 황금열쇠가 없어요':'')+'</div>';
  const others=s.players.map((p,k)=>k!==me&&p.cards&&p.cards.length?'<span style="color:'+C[k]+'">●</span> '+esc(p.name)+' '+p.cards.map(c=>KD[c][0]).join(", "):"").filter(Boolean);
  if(others.length)kz+='<div class="dim">'+others.join("<br>")+'</div>';
  $("kz").innerHTML=kz;
}

// ===== 배경음악: 각자 따로 켜고 끔, 볼륨 10% 단위, 끊김 없이 반복 =====
const BGM={ctx:null,tr:[{src:"bgm1.mp3",name:"대기실 음악",buf:null,st:"",node:null,gain:null},{src:"bgm2.mp3",name:"게임 음악",buf:null,st:"",node:null,gain:null}],cur:-1,
  set:(()=>{let o=null;try{o=JSON.parse(lsGet("am_bgm")||"null")}catch(_){}if(o&&o.ver!==3)o.v=[30,20];return Object.assign({on:[true,true],v:[30,20],ver:3},o||{},{ver:3});})(),
  save(){lsSet("am_bgm",JSON.stringify(this.set));},
  want(){return document.body.classList.contains("ingame")&&S&&S.phase!=="lobby"?1:0;},
  ensure(){if(this.ctx)return this.ctx;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;try{this.ctx=new AC();}catch(_){return null;}return this.ctx;},
  async load(k){
    const t=this.tr[k];if(t.buf||t.st==="loading"||t.st==="none")return;
    const ctx=this.ensure();if(!ctx){t.st="none";return;}
    t.st="loading";
    try{const r=await fetch(t.src);if(!r.ok)throw 0;const ab=await r.arrayBuffer();
      t.buf=await new Promise((ok,no)=>{const p=ctx.decodeAudioData(ab,ok,no);if(p&&p.then)p.then(ok,no);});
      // 앞뒤 무음 구간을 찾아 반복 지점으로 사용 (끊김 없는 루프)
      const d=t.buf.getChannelData(0),th=0.003;let a=0,b=d.length-1;while(a<b&&Math.abs(d[a])<th)a++;while(b>a&&Math.abs(d[b])<th)b--;
      t.ls=a/t.buf.sampleRate;t.le=(b+1)/t.buf.sampleRate;t.st="ok";
    }catch(e){t.st="none";}
    this.sync();bgmUI();
  },
  vol(k){return this.set.on[k]?this.set.v[k]/100:0;},
  start(k){
    const t=this.tr[k],ctx=this.ctx;if(!t.buf||t.node)return;
    const g=ctx.createGain();g.gain.value=0;g.connect(ctx.destination);
    const n=ctx.createBufferSource();n.buffer=t.buf;n.loop=true;n.loopStart=t.ls;n.loopEnd=t.le;n.connect(g);n.start(0,t.ls);
    t.node=n;t.gain=g;
  },
  stop(k){const t=this.tr[k];if(!t.node)return;const n=t.node,g=t.gain,ctx=this.ctx;t.node=null;t.gain=null;
    try{g.gain.cancelScheduledValues(ctx.currentTime);g.gain.setValueAtTime(g.gain.value,ctx.currentTime);g.gain.linearRampToValueAtTime(0,ctx.currentTime+.8);n.stop(ctx.currentTime+.85);}catch(_){try{n.stop()}catch(__){}}},
  sync(){
    const ctx=this.ctx;if(!ctx)return;
    const k=this.want();
    this.tr.forEach((t,j)=>{if(j!==k||!this.set.on[j])this.stop(j);});
    if(this.set.on[k]){if(!this.tr[k].buf){this.load(k);return;}this.start(k);
      const g=this.tr[k].gain;if(g){g.gain.cancelScheduledValues(ctx.currentTime);g.gain.setValueAtTime(g.gain.value,ctx.currentTime);g.gain.linearRampToValueAtTime(this.vol(k),ctx.currentTime+(this.cur!==k?1:.15));}}
    this.cur=k;
  },
  unlock(){const ctx=this.ensure();if(!ctx)return;if(ctx.state!=="running"){try{ctx.resume().then(()=>{this.sync();bgmUI();},()=>{});}catch(_){}}else this.sync();}
};
function bgmCtl(k){
  const t=BGM.tr[k],on=BGM.set.on[k],v=BGM.set.v[k],held=on&&t.st==="ok"&&BGM.ctx&&BGM.ctx.state!=="running";
  if(t.st==="none")return '<div class="bgm off" title="'+t.src+' 파일을 index.html과 같은 곳에 올리면 재생돼요">🎵 '+t.name+' · 음악 파일이 없어요</div>';
  return '<div class="bgm'+(on?'':' off')+'"><button class="g sm" data-m="tog" data-k="'+k+'">'+(on?'🔊':'🔇')+'</button><span>'+t.name+'</span><button class="g sm" data-m="dn" data-k="'+k+'"'+(!on||v<=0?' disabled':'')+'>−</button><b>'+v+'%</b><button class="g sm" data-m="up" data-k="'+k+'"'+(!on||v>=100?' disabled':'')+'>+</button></div>'+(held?'<div class="bgmw">브라우저가 소리를 막고 있어요 · 아무 곳이나 한 번 누르거나 이름을 입력하면 나와요</div>':'');
}
function bgmUI(){const h=$("bgmh");if(h)h.innerHTML=bgmCtl(0);const g=$("bgmg");if(g)g.innerHTML=bgmCtl(BGM.want());}
["pointerdown","pointerup","mousedown","touchstart","keydown","click"].forEach(ev=>document.addEventListener(ev,()=>BGM.unlock(),true));
document.addEventListener("click",e=>{
  const m=e.target.closest("[data-m]");if(!m)return;e.stopPropagation();
  const k=+m.dataset.k,a=m.dataset.m;
  if(a==="tog")BGM.set.on[k]=!BGM.set.on[k];
  else if(a==="up")BGM.set.v[k]=Math.min(100,BGM.set.v[k]+10);
  else if(a==="dn")BGM.set.v[k]=Math.max(0,BGM.set.v[k]-10);
  BGM.save();BGM.unlock();BGM.sync();bgmUI();
},true);

// ===== Events =====
document.addEventListener("click",e=>{
  const el=e.target;
  if(el.closest("#fs")){try{const r=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>{});}catch(_){}return;}
  const hb=el.closest("[data-h]");
  if(hb){const h=hb.dataset.h;
    if(h==="create")enter(true);else if(h==="join")enter(false);
    else if(h==="pvx"){PV=null;rsig="";render();}
    else if(h==="keys"){MODAL="keys";render();}
    else if(h==="dskin"){MODAL="dskin";renderModal(S);}
    else if(h==="rules"){MODAL="rules";BOOKP=0;renderModal(S);}
    else if(h==="bnext"||h==="bprev"){const mx=Math.ceil(BOOK.length/2)-1;BOOKP=Math.max(0,Math.min(mx,BOOKP+(h==="bnext"?1:-1)));BOOKD=h==="bnext"?"nx":"pv";renderModal(S);}
    else if(h==="leaveask"){MODAL="leave";renderModal(S);}
    else if(h==="leaveyes"){MODAL="";renderModal(S);act("leave");setTimeout(goHome,300);}
    else if(h==="mclose"){MODAL="";S?render():renderModal(null);}
    else if(h==="kall1"||h==="kall0"){act("opt","kall:"+(h==="kall1"?1:0));}
    else if(h==="copy"){const txt=NET.mode==="peer"?location.origin+location.pathname+"#"+CODE:CODE;try{navigator.clipboard.writeText(txt).then(()=>toast(NET.mode==="peer"?"초대 링크를 복사했어요":"방 코드 "+CODE+" 를 복사했어요"),()=>toast("방 코드: "+CODE));}catch(_){toast("방 코드: "+CODE);}}
    return;}
  const bpb=el.closest("[data-bp]");if(bpb){const t=+bpb.dataset.bp;if(t!==BOOKP){BOOKD=t>BOOKP?"nx":"pv";BOOKP=t;}renderModal(S);return;}
  const dk=el.closest("[data-dk]");if(dk){const id=dskOk(dk.dataset.dk);DSK=lsSet("am_dice",id);if(S&&NET.ready&&S.players.some(p=>p.id===uid))act("dskin",id);if(S)render();else renderModal(null);return;}
  const ko=el.closest("[data-ko]");if(ko){act("opt","koff:"+ko.dataset.ko);return;}
  if(el.id==="modal"){MODAL="";S?render():renderModal(null);return;}
  const sp=el.closest("[data-sp]");if(sp&&!el.closest("button")){SELP=SELP===sp.dataset.sp?"":sp.dataset.sp;render();return;}
  const sc=el.closest("[data-col]");if(sc){if(!sc.disabled)act("color",sc.dataset.col);return;}
  const evx=el.closest("[data-ev]");if(evx){EVDIS=+evx.dataset.ev;clearTimeout(EVT);render();return;}
  const kd=el.closest("[data-kd]");if(kd){KDIS=+kd.dataset.kd;if(S&&S.phase==="keygo"&&S.kc&&S.kc.n===+kd.dataset.kd&&S.players[S.turn]&&S.players[S.turn].id===uid)act("keyok");else render();return;}
  const b0=el.closest("[data-b]");if(b0){if(!b0.disabled)act("bld",b0.dataset.b);return;}
  if(el.closest(".ds"))return;
  const dd=el.closest("[data-d]");if(dd){const i=+dd.dataset.d;FL.has(i)?FL.delete(i):FL.add(i);dd.classList.toggle("f");return;}
  const pv=el.closest("[data-pv]");if(pv){PV={t:"d",i:+pv.dataset.pv};rsig="";render();return;}
  const pk=el.closest("[data-pk]");if(pk){PV={t:"k",c:+pk.dataset.pk};rsig="";render();return;}
  const ff=el.closest("[data-f]");if(ff){FILT=ff.dataset.f;rsig="";render();return;}
  const a=el.closest("[data-a]");
  if(a){const id=a.dataset.a+":"+(a.dataset.v||"");
    if(a.dataset.arm&&ARM!==id&&!(a.dataset.a==="leave"&&S&&S.phase==="lobby")){ARM=id;clearTimeout(armT);armT=setTimeout(()=>{ARM="";render();},3000);render();return;}
    ARM="";
    if(a.dataset.a==="leave"){if(NET.mode==="peer"&&NET.isHost&&S&&S.players.length>1)toast("방장이 나가면 방이 닫혀요");act("leave");setTimeout(goHome,300);return;}
    if(a.disabled)return;
    const an=a.dataset.a;
    if(an==="loan"){if(!(+loanDraft>0)){toast("빌릴 금액을 입력해 주세요");return;}act("loan",loanDraft);return;}
    if(an==="repay"){act("repay",+loanDraft>0?loanDraft:0);return;}
    if(an==="repayall"){act("repay",0);return;}
    act(an,an==="prize"?prizeDraft:a.dataset.v);return;}
  const b=el.closest("[data-b]");if(b){act("bld",b.dataset.b);return;}
  const t=el.closest("[data-t]");
  if(t&&S){const i=+t.dataset.t,me=S.players.findIndex(p=>p.id===uid);
    if(S.phase==="roll"&&me===S.turn&&me>=0&&S.players[me].space)act("warp",i);
    else if(T[i].t==="city"){PV={t:"d",i:i};rsig="";render();}}
});
document.addEventListener("change",e=>{if(e.target.id==="otake")act("opt","take:"+(e.target.checked?1:0));if(e.target.id==="oloan")act("opt","loan:"+(e.target.checked?1:0));if(e.target.id==="olaps")act("opt","laps:"+e.target.value);if(e.target.id==="omax")act("opt","max:"+e.target.value);if(e.target.id==="osal")act("opt","sal:"+e.target.value);});
document.addEventListener("input",e=>{if(e.target.id==="ln")loanDraft=e.target.value;if(e.target.id==="pz")prizeDraft=e.target.value;if(e.target.id==="sm")moneyDraft=e.target.value;});
document.addEventListener("keydown",e=>{if(MODAL){if(e.key==="Escape"){MODAL="";S?render():renderModal(null);return;}if(MODAL==="rules"&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const mx=Math.ceil(BOOK.length/2)-1;BOOKP=Math.max(0,Math.min(mx,BOOKP+(e.key==="ArrowRight"?1:-1)));BOOKD=e.key==="ArrowRight"?"nx":"pv";renderModal(S);return;}}if(e.key==="Enter"&&!document.body.classList.contains("ingame")){if(e.target.id==="hc")enter(false);else if(e.target.id==="hn")($("hc").value.trim()?enter(false):enter(true));}});
(async function(){
  $("hn").value=lsGet("am_name")||"";
  const h=(location.hash||"").slice(1).toUpperCase();if(/^[A-Z0-9]{4,6}$/.test(h))$("hc").value=h;
  hmsg("준비 중...");
  await NET.boot();
  hmsg(NET.mode==="off"?"Claude에 로그인한 상태에서 열어 주세요":"");
  bgmUI();BGM.load(0).then(()=>{BGM.unlock();setTimeout(bgmUI,300);});
  try{if(!$("hn").value)$("hn").focus();}catch(_){}
  $("mode").textContent="v"+APPVER+" · © airk10";
  if(NET.mode!=="off"&&$("hc").value&&$("hn").value.trim())enter(false);
})();
